name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify PHP and package contracts
        run: |
          composer run lint
          composer run test
          vendor/bin/invoiceshelf-module validate-module module.json
          vendor/bin/invoiceshelf-module validate-package .

      - name: Verify frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm run build
          git diff --exit-code -- dist

  # The suite again on PostgreSQL, which rejects SQL that SQLite accepts (0.2.0
  # shipped a FOR UPDATE on an aggregate that no PostgreSQL install could run).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pdo_pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test on PostgreSQL
        run: composer run test

